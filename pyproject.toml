[project]
name = "zetra"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Artur", email = "arturgab008@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scipy>=1.18.1",
]

[tool.maturin]
module-name = "zetra._core"
python-packages = ["zetra"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "maturin>=1.16.0",
    "pytest>=9.2.0",
]
